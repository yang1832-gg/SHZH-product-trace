name: Import original product trace site

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Mirror the original repository
        env:
          TOKEN: ${{ github.token }}
          TARGET_REPOSITORY: ${{ github.repository }}
        run: |
          git clone --mirror https://github.com/yang1832-gg/product-trace.git source.git
          cd source.git
          git remote set-url origin "https://x-access-token:${TOKEN}@github.com/${TARGET_REPOSITORY}.git"
          git push --mirror
