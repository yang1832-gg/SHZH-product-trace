name: Import original product trace site

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy the original repository
        run: |
          git clone --depth 1 https://github.com/yang1832-gg/product-trace.git /tmp/source
          rsync -a --exclude=.git --exclude=.github/workflows/pages.yml /tmp/source/ "$GITHUB_WORKSPACE/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import original product trace site"
          git push origin HEAD:main
